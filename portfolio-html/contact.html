<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contact Us</h1>
    <p>Have questions or want to get in touch? Fill out the form below and we'll get back to you as soon as possible.</p>
    <!--contact form with text input name, email, dropdown, radio buttons group - A **textarea** for messages.
- A **submit button** (`<button type="submit">`).
- A **hidden input** for anti-spam.-->

    <form action="https://example.com/contact" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="reason">Reason for Contact:</label>
        <select id="dropdown" name="dropdown" title="Reason for Contact">
            <option value="general">General Inquiry</option>
            <option value="support">Support</option>
            <option value="feedback">Feedback</option>
        </select><br><br>

        <p>Preferred Contact Method:</p>
        <input type="radio" id="contact_email" name="contact_method" value="email">
        <label for="contact_email">Email</label><br>
        <input type="radio" id="contact_phone" name="contact_method" value="phone">
        <label for="contact_phone">Phone</label><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>

        <input type="hidden" name="_gotcha">

        <button type="submit">Submit</button>
    </form>
</body>
</html>
